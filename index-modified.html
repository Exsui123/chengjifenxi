<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩分析系统 - 优化示例</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e9ecff 0%, #f2f6ff 100%);
            color: #333333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h2 {
            margin-bottom: 20px;
            color: #4a6cf7;
        }
        
        /* 饼图统计信息样式 */
        .chart-stats-container {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        .chart-stats-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 15px;
        }

        .chart-stats-row {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .stats-item {
            background: rgba(248, 249, 250, 0.8);
            border-radius: 8px;
            padding: 12px 15px;
            flex: 1;
            min-width: 120px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .stats-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .stats-item.excellent {
            border-left-color: #4CAF50;
        }

        .stats-item.good {
            border-left-color: #2196F3;
        }

        .stats-item.pass {
            border-left-color: #FF9800;
        }

        .stats-item.fail {
            border-left-color: #F44336;
        }

        .stats-item.total {
            border-left-color: #9C27B0;
        }

        .stats-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .stats-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .stats-percentage {
            font-size: 15px;
            color: #777;
            margin-left: 8px;
        }

        .score-threshold-info {
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(248, 249, 250, 0.5);
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            border-left: 4px solid #9C27B0;
        }

        /* 响应式设计调整 */
        @media screen and (max-width: 768px) {
            .chart-stats-content {
                flex-direction: column;
            }
            
            .stats-item {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>第一次考试 一班 - 语文 成绩等级占比</h2>
            
            <!-- 图表区域 -->
            <div class="chart-container" style="height: 400px; background-color: #f8f9fa; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <p style="color: #666;">此处显示饼图</p>
            </div>
            
            <!-- 优化后的统计信息展示 -->
            <div class="chart-stats-container">
                <div class="chart-stats-content">
                    <div class="chart-stats-row">
                        <div class="stats-item excellent">
                            <div class="stats-label">优秀</div>
                            <div class="stats-value">25人<span class="stats-percentage">50.0%</span></div>
                        </div>
                        <div class="stats-item good">
                            <div class="stats-label">良好</div>
                            <div class="stats-value">22人<span class="stats-percentage">44.0%</span></div>
                        </div>
                    </div>
                    <div class="chart-stats-row">
                        <div class="stats-item pass">
                            <div class="stats-label">及格</div>
                            <div class="stats-value">0人<span class="stats-percentage">0.0%</span></div>
                        </div>
                        <div class="stats-item fail">
                            <div class="stats-label">不及格</div>
                            <div class="stats-value">3人<span class="stats-percentage">6.0%</span></div>
                        </div>
                    </div>
                </div>
                <div class="score-threshold-info">
                    <div class="stats-item total">
                        <div class="stats-label">总计</div>
                        <div class="stats-value">50人 <span class="stats-percentage">(无效数据: 0人)</span></div>
                    </div>
                    <div style="margin-top: 10px;">分数线设置: 优秀≥90分, 良好≥75分, 及格≥60分</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
